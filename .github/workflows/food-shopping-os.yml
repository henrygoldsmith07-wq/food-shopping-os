name: Food Shopping OS

on:
  push:
    paths:
      - "**"
      - ".github/workflows/food-shopping-os.yml"
  pull_request:
    paths:
      - "**"
      - ".github/workflows/food-shopping-os.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Static type checking
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Security audit (high-severity production deps block CI)
        run: |
          echo "Running production audit — high or critical vulnerabilities will block CI."
          if npm audit --omit=dev --audit-level=high; then
            echo "No high/critical production vulnerabilities."
          else
            code=$?
            echo "::error::High-severity production vulnerability found (exit $code). Fix before merging."
            echo "Tip: dev-only advisories do not block — production audit is scoped with --omit=dev."
            exit $code
          fi

      - name: Advisory dev audit (informational)
        run: npm audit --audit-level=moderate || true
        continue-on-error: true

      - name: Performance budgets
        run: node scripts/check-performance-budgets.mjs --require-builds --only=.

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E
        run: npx playwright test tests/e2e --grep-invert "accessibility"

      - name: Accessibility tests
        run: npx playwright test tests/e2e/a11y.spec.js

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: food-shopping-os-playwright-report
          path: playwright-report/
          retention-days: 14
